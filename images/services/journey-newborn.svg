<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <circle cx="80" cy="80" r="68" fill="#E6F0FF"/>
  <circle cx="80" cy="80" r="60" fill="#DCEAFF" opacity="0.6"/>
  <!-- Soft floating sparkle accents -->
  <circle cx="34" cy="48" r="3" fill="#1749C9" opacity="0.28"/>
  <circle cx="126" cy="112" r="3.5" fill="#0AA779" opacity="0.32"/>

  <!-- Sleeping Swaddled Newborn (Gentle Diagonal Pose) -->
  <g transform="translate(80, 82) rotate(-26)">
    <!-- Swaddle body -->
    <rect x="-26" y="-12" width="52" height="68" rx="26" fill="#3B78E7" stroke="#172B50" stroke-width="3.2"/>
    <!-- Swaddle wrap fold lines -->
    <path d="M-24 10 C-6 20, 10 20, 25 8" stroke="#172B50" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M-18 32 C-2 24, 14 28, 22 40" stroke="#93C5FD" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-18 32 C-2 24, 14 28, 22 40" stroke="#172B50" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Soft inner collar trim -->
    <path d="M-18 -8 C-8 4, 8 4, 18 -8" fill="#BFDBFE" stroke="#172B50" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Baby Head -->
    <circle cx="0" cy="-26" r="22" fill="#FFD3B6" stroke="#172B50" stroke-width="3.2"/>
    <!-- Ears -->
    <circle cx="-22" cy="-26" r="5" fill="#FFC19E" stroke="#172B50" stroke-width="2.6"/>
    <circle cx="22" cy="-26" r="5" fill="#FFC19E" stroke="#172B50" stroke-width="2.6"/>
    <!-- Cute top hair curl -->
    <path d="M-2 -47 C-6 -54, 4 -56, 6 -48 C8 -43, 2 -41, 0 -44" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Peaceful closed eyes -->
    <path d="M-11 -27 C-9 -24, -5 -24, -3 -27" stroke="#172B50" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M3 -27 C5 -24, 9 -24, 11 -27" stroke="#172B50" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="-13" cy="-21" r="3.5" fill="#FF9AA2" opacity="0.65"/>
    <circle cx="13" cy="-21" r="3.5" fill="#FF9AA2" opacity="0.65"/>
    <!-- Gentle sleeping smile -->
    <path d="M-4 -17 C-2 -14.5, 2 -14.5, 4 -17" stroke="#172B50" stroke-width="2.3" stroke-linecap="round"/>
  </g>
</svg>
