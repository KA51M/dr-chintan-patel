    <!-- Bangs & Hair -->
    <path d="M-21 -38 C-20 -55, -6 -59, 0 -57 C8 -59, 21 -54, 21 -38 C14 -45, 5 -43, 0 -46 C-5 -43, -14 -45, -21 -38 Z" fill="#4A2E1B" stroke="#172B50" stroke-width="3" stroke-linejoin="round"/>
    <!-- Eyes & Warm Smile -->
    <circle cx="-7.5" cy="-34" r="2.6" fill="#172B50"/>
    <circle cx="7.5" cy="-34" r="2.6" fill="#172B50"/>
    <circle cx="-12.5" cy="-27" r="3.5" fill="#FF9AA2" opacity="0.65"/>
    <circle cx="12.5" cy="-27" r="3.5" fill="#FF9AA2" opacity="0.65"/>
    <path d="M-5.5 -24 C-2.5 -20, 2.5 -20, 5.5 -24" stroke="#172B50" stroke-width="2.5" stroke-linecap="round"/>
