<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <circle cx="80" cy="80" r="68" fill="#E6F0FF"/>
  <circle cx="80" cy="80" r="60" fill="#DCEAFF" opacity="0.6"/>
  <circle cx="34" cy="48" r="3" fill="#1749C9" opacity="0.28"/>
  <circle cx="126" cy="112" r="3" fill="#0AA779" opacity="0.32"/>

  <!-- Confident School-Age Kid with Backpack -->
  <g transform="translate(80, 90)">
    <!-- Backpack behind shoulders -->
    <rect x="-28" y="-14" width="56" height="44" rx="14" fill="#0AA779" stroke="#172B50" stroke-width="3.2"/>

    <!-- Shirt / Sweater -->
    <path d="M-23 -12 L23 -12 L25 36 C12 40, -12 40, -25 36 Z" fill="#1749C9" stroke="#172B50" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Backpack Straps -->
    <rect x="-18" y="-13" width="8" height="36" rx="4" fill="#34D399" stroke="#172B50" stroke-width="2.6"/>
    <rect x="10" y="-13" width="8" height="36" rx="4" fill="#34D399" stroke="#172B50" stroke-width="2.6"/>
    <!-- White Collar -->
    <path d="M-10 -12 L0 -4 L10 -12 Z" fill="#FFFFFF" stroke="#172B50" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Head -->
    <circle cx="0" cy="-34" r="21" fill="#FFD3B6" stroke="#172B50" stroke-width="3.2"/>
    <circle cx="-21" cy="-34" r="4.5" fill="#FFC19E" stroke="#172B50" stroke-width="2.6"/>
    <circle cx="21" cy="-34" r="4.5" fill="#FFC19E" stroke="#172B50" stroke-width="2.6"/>
    <!-- Neat School-Age Hair -->
    <path d="M-21 -38 C-21 -56, -8 -61, 3 -58 C15 -57, 22 -49, 21 -37 C14 -45, 4 -47, -6 -45 C-13 -44, -18 -41, -21 -38 Z" fill="#3E2723" stroke="#172B50" stroke-width="3" stroke-linejoin="round"/>
    <!-- Eyes & Confident Smile -->
    <circle cx="-7.5" cy="-34" r="2.7" fill="#172B50"/>
    <circle cx="7.5" cy="-34" r="2.7" fill="#172B50"/>
    <circle cx="-12.5" cy="-27" r="3.4" fill="#FF9AA2" opacity="0.6"/>
    <circle cx="12.5" cy="-27" r="3.4" fill="#FF9AA2" opacity="0.6"/>
    <path d="M-6 -24 C-2.5 -19.5, 2.5 -19.5, 6 -24" stroke="#172B50" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
