  <!-- Left & Right Bushes -->
  <path d="M23 134C21 125 28 119 35 123C37 119 44 121 44 127V134H23Z" fill="#34D399" stroke="#172B50" stroke-width="3" stroke-linejoin="round"/>
  <path d="M116 134V127C116 121 123 119 125 123C132 119 139 125 137 134H116Z" fill="#34D399" stroke="#172B50" stroke-width="3" stroke-linejoin="round"/>

